_format_version: "3.0"
_transform: true

# Declarative Kong config for the DB-less production deploy (see deploy/README.md).
# This replaces the imperative scripts/kong-setup.sh + scripts/kong-advanced.sh flow
# used for local dev (those still POST to Kong's Admin API against kong-database).
#
# Differences from the two scripts, and why:
#   - auth-api / chat-api routes use strip_path: false (the scripts had strip_path: true
#     with a matching path equal to the service's real mount path, e.g. "/api/v1/auth" ->
#     stripped to "" -> 404 from auth-service, which only listens on /api/v1/auth/*).
#   - auth-health/auth-docs/auth-root (and the chat equivalents) are collapsed into one
#     "/auth" ("/chat") prefix route with strip_path: true, so /auth/health -> /health and
#     /auth/docs -> /docs actually reach the service's real routes instead of the stripped
#     request landing on "/" every time.
#   - Dropped: jwt/key-auth consumers (created in kong-advanced.sh but the jwt/key-auth
#     plugins were never attached to a service or route, so they had no effect — both
#     services already verify JWTs themselves), ip-restriction allowing 0.0.0.0/0 (a no-op),
#     bot-detection denying curl/wget (would block the documented curl-based health checks
#     and smoke tests), http-log to httpbin.org (placeholder demo endpoint), file-log (no
#     volume/aggregation wired up for it here; stdout access logs via `docker compose logs
#     kong` cover this at this scale), and datadog (DATADOG_API_KEY was never set).
#   - The two separate response-transformer plugin instances (one adding X-Powered-By, one
#     removing it) are merged into a single instance.

services:
  - name: auth-service
    url: http://auth-service:3001
    retries: 5
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    tags: ["microservice", "auth", "production"]
    routes:
      - name: auth-api
        paths: ["/api/v1/auth"]
        methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        strip_path: false
      - name: auth-gateway
        paths: ["/auth"]
        # Not just health/docs (GET) — the actual frontend calls register/login through this
        # prefix too (e.g. /auth/api/v1/auth/register), not the bare /api/v1/auth/* path.
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Gateway:Kong"
              - "X-Service:auth-service"

  - name: chat-service
    url: http://chat-service:3002
    retries: 5
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    tags: ["microservice", "chat", "production"]
    routes:
      - name: chat-api
        paths: ["/api"]
        methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        strip_path: false
      - name: chat-gateway
        paths: ["/chat"]
        # Not just health/docs (GET) — the actual frontend calls messages/rooms/users through
        # this prefix too (e.g. /chat/api/messages), not the bare /api/messages path.
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
        strip_path: true
      - name: websocket
        paths: ["/socket.io"]
        methods: ["GET", "POST"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          hour: 10000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Gateway:Kong"
              - "X-Service:chat-service"

# Global plugins
plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
      headers:
        [
          "Accept",
          "Accept-Version",
          "Content-Length",
          "Content-MD5",
          "Content-Type",
          "Date",
          "Authorization",
          "X-Auth-Token",
        ]
      exposed_headers: ["X-Auth-Token"]
      credentials: true
      max_age: 3600
      preflight_continue: false

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Response-Time:$upstream_response_time"
          - "X-Content-Type-Options:nosniff"
          - "X-Frame-Options:DENY"
          - "X-XSS-Protection:1; mode=block"
          - "Referrer-Policy:strict-origin-when-cross-origin"
      remove:
        headers:
          - "Server"
          - "X-Powered-By"

  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      size_unit: megabytes
      require_content_length: false

  # Maintenance mode toggle — disabled by default. In DB-less mode this can no longer be
  # flipped at runtime via the Admin API (Makefile's maintenance-on/off targets are dev-only,
  # local-Postgres-backed Kong). To use it here: edit `enabled: true` below, then redeploy
  # (re-run `make prod-up`, which reloads this file into Kong).
  - name: request-termination
    enabled: false
    config:
      status_code: 503
      content_type: application/json
      body: '{"message": "Service temporarily unavailable for maintenance", "retry_after": 3600, "status": "maintenance"}'

  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # Kong's bundled plugin for this is named "correlation-id" (kong-advanced.sh called it
  # "request-id", which isn't a real Kong plugin name — that POST would have silently failed).
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true
